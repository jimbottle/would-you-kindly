name: release

# Cut a GitHub release when a vX.Y.Z tag is pushed. `wyk update` and
# `wyk version --check` read the GitHub releases feed and install via
# `go install …@<tag>`, so a tagged release is all that's needed — no
# binary artifacts. The release notes come straight from the matching
# CHANGELOG.md section, so the changelog stays the single source of truth.
on:
  push:
    # Match the documented vX.Y.Z contract — require a digit after the `v`
    # so stray tags (vfoo, v-test, vnext) can't trigger a real release with
    # an empty-CHANGELOG placeholder body.
    tags: ['v[0-9]*']

permissions:
  contents: write # create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned for supply-chain safety (version in the trailing comment);
      # both run on the Node 24 runtime. Keep in sync with test.yml.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Sanity-check the tag compiles
        run: go build ./...

      - name: Extract release notes from CHANGELOG
        run: |
          ver="${GITHUB_REF_NAME#v}"
          # Pull the lines between "## [<ver>]" and the next "## [" header,
          # buffering them so the END block can strip the blank lines that
          # bracket the section (the blank under the header and the ones
          # before the next header) — otherwise the release notes render
          # with leading/trailing whitespace. Single awk, no GNU-only tools.
          awk -v hdr="## [$ver]" '
            index($0, hdr) == 1 { grab = 1; next }
            grab && /^## \[/    { exit }
            grab                { lines[++n] = $0 }
            END {
              s = 1; while (s <= n && lines[s] ~ /^[[:space:]]*$/) s++
              e = n; while (e >= s && lines[e] ~ /^[[:space:]]*$/) e--
              for (i = s; i <= e; i++) print lines[i]
            }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section for $ver — using a placeholder." >&2
            echo "Release ${GITHUB_REF_NAME}. See CHANGELOG.md." > notes.md
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
